<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Depth Probe</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e8ee;
          --muted:#8b93a7; --accent:#7cc4ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; gap:16px; align-items:center; }
  h1 { font-size:16px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  main { padding:20px; }
  .controls { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  input[type=file], button, select {
    background:#0b0d12; color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer;
  }
  button.primary { background:var(--accent); color:#06121e; border:0; font-weight:600; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:12px; }
  .card h2 { font-size:12px; color:var(--muted); margin:0 0 8px; text-transform:uppercase;
    letter-spacing:0.05em; }
  canvas, img { max-width:100%; height:auto; display:block; border-radius:4px;
    background:#0b0d12; }
  #log { margin-top:16px; padding:12px; background:#0b0d12; border:1px solid var(--border);
    border-radius:6px; font-family: ui-monospace, monospace; font-size:12px;
    color:var(--muted); max-height:200px; overflow-y:auto; white-space:pre-wrap; }
  .status { color:var(--accent); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Depth Probe</h1>
  <div class="sub">Depth Anything V2 Small · transformers.js · WebGPU</div>
</header>

<main>
  <div class="controls">
    <input id="file" type="file" accept="image/*" />
    <select id="backend">
      <option value="webgpu">WebGPU (fast)</option>
      <option value="wasm">WASM (CPU fallback)</option>
    </select>
    <button id="run" class="primary" disabled>Load model & run</button>
    <span id="status" class="status"></span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Source</h2>
      <img id="src" alt="" />
    </div>
    <div class="card">
      <h2>Depth map</h2>
      <canvas id="depth"></canvas>
    </div>
  </div>

  <div id="log"></div>
</main>

<script type="module">
import { pipeline, env, RawImage } from
  'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

const $ = (id) => document.getElementById(id);
const fileEl = $('file'), runBtn = $('run'), srcImg = $('src'),
      depthCanvas = $('depth'), logEl = $('log'), statusEl = $('status'),
      backendEl = $('backend');

let imageURL = null;
let depthPipeline = null;
let loadedBackend = null;

const log = (msg) => {
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
};
const setStatus = (msg) => { statusEl.textContent = msg; };

env.allowLocalModels = false;
env.useBrowserCache = false;
env.useFSCache = false;
env.useCustomCache = false;

fileEl.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = URL.createObjectURL(f);
  srcImg.src = imageURL;
  runBtn.disabled = false;
  log(`Loaded: ${f.name} (${(f.size / 1024).toFixed(1)} KB)`);
});

runBtn.addEventListener('click', async () => {
  if (!imageURL) return;
  runBtn.disabled = true;
  const backend = backendEl.value;

  try {
    if (!depthPipeline || loadedBackend !== backend) {
      setStatus(`Loading model on ${backend}…`);
      log(`Loading depth-anything/Depth-Anything-V2-Small-hf on ${backend}…`);
      const t0 = performance.now();
      depthPipeline = await pipeline(
        'depth-estimation',
        'onnx-community/depth-anything-v2-small',
        { device: backend, dtype: backend === 'webgpu' ? 'fp32' : 'fp32' }
      );
      loadedBackend = backend;
      log(`Model ready in ${((performance.now() - t0) / 1000).toFixed(2)}s`);
    }

    setStatus('Running inference…');
    log('Running inference…');
    const t1 = performance.now();
    const image = await RawImage.fromURL(imageURL);
    const { depth } = await depthPipeline(image);
    const elapsed = ((performance.now() - t1) / 1000).toFixed(2);
    log(`Inference: ${elapsed}s · depth ${depth.width}×${depth.height}`);

    renderDepth(depth);
    setStatus(`Done in ${elapsed}s`);
  } catch (err) {
    log(`ERROR: ${err.message}`);
    setStatus('Error — see log');
    console.error(err);
  } finally {
    runBtn.disabled = false;
  }
});

function renderDepth(depth) {
  const { data, width, height } = depth;
  depthCanvas.width = width;
  depthCanvas.height = height;
  const ctx = depthCanvas.getContext('2d');
  const img = ctx.createImageData(width, height);

  // depth.data is Uint8Array (channels-first: 1 channel already normalized 0..255)
  for (let i = 0; i < width * height; i++) {
    const v = data[i];
    img.data[i * 4]     = v;
    img.data[i * 4 + 1] = v;
    img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

log('Ready. Pick an image, then click "Load model & run".');
log('First run downloads ~50MB (cached after).');
</script>
</body>
</html>
